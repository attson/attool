name: Publish Catalog

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Registered application ID
        required: true
        type: string
      release_tag:
        description: Public application release tag
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-catalog
  cancel-in-progress: false

jobs:
  publish:
    name: Verify application and prepare Catalog PR
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve registered application
        id: application
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          APPLICATION=$(jq -cer --arg app_id "$APP_ID" '
            [.apps[] | select(.appId == $app_id)] |
            if length == 1 then .[0] else error("application is not registered") end
          ' .github/catalog/apps.json)
          {
            echo "slug=$(jq -r '.slug' <<<"$APPLICATION")"
            echo "repository=$(jq -r '.repository' <<<"$APPLICATION")"
            echo "artifact_prefix=$(jq -r '.artifactPrefix' <<<"$APPLICATION")"
            echo "name=$(jq -r '.name' <<<"$APPLICATION")"
            echo "publisher_key_secret=$(jq -r '.publisherKeySecret' <<<"$APPLICATION")"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure no Catalog update is pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_CATALOG_PRS=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("catalog/"))] | length')
          if [ "$OPEN_CATALOG_PRS" -ne 0 ]; then
            echo "Merge or close the pending Catalog pull request before publishing another version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Catalog publisher
        run: pnpm test:catalog

      - name: Require committed trust metadata
        run: |
          test -f catalog/v1/root.json
          test -f catalog/v1/root.json.sig
          CATALOG_FILE_COUNT=0
          [ ! -f catalog/v1/catalog.json ] || CATALOG_FILE_COUNT=$((CATALOG_FILE_COUNT + 1))
          [ ! -f catalog/v1/catalog.json.sig ] || CATALOG_FILE_COUNT=$((CATALOG_FILE_COUNT + 1))
          if [ "$CATALOG_FILE_COUNT" -eq 1 ]; then
            echo "Catalog and Catalog signature must either both exist or both be absent" >&2
            exit 1
          fi

      - name: Read public application release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APP_REPOSITORY: ${{ steps.application.outputs.repository }}
          APP_SLUG: ${{ steps.application.outputs.slug }}
          ARTIFACT_PREFIX: ${{ steps.application.outputs.artifact_prefix }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a v-prefixed SemVer" >&2
            exit 1
          fi
          ASSET_DIRECTORY="${RUNNER_TEMP}/${APP_SLUG}-assets"
          RELEASE_SOURCE="${RUNNER_TEMP}/${APP_SLUG}-release-source.json"
          RELEASE_JSON="${RUNNER_TEMP}/${APP_SLUG}-release.json"
          mkdir -p "$ASSET_DIRECTORY"
          gh api "repos/${APP_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RELEASE_SOURCE"
          jq -e '.draft == false and .published_at != null' "$RELEASE_SOURCE" >/dev/null
          jq --arg prefix "${ARTIFACT_PREFIX}_" '{
            tagName: .tag_name,
            publishedAt: .published_at,
            notes: (.body // ""),
            assets: [.assets[] | select((.name | startswith($prefix)) and (.name | endswith(".atpkg"))) | {
              fileName: .name,
              size: .size,
              url: .browser_download_url
            }]
          }' "$RELEASE_SOURCE" > "$RELEASE_JSON"
          test "$(jq '.assets | length' "$RELEASE_JSON")" -eq 5
          gh release download "$RELEASE_TAG" \
            --repo "$APP_REPOSITORY" \
            --pattern "${ARTIFACT_PREFIX}_*.atpkg" \
            --dir "$ASSET_DIRECTORY"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "release_json=$RELEASE_JSON" >> "$GITHUB_OUTPUT"
          echo "asset_directory=$ASSET_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Verify packages and sign next Catalog
        env:
          ATTOOL_CATALOG_ROOT_PUBLIC_KEY: ${{ secrets.ATTOOL_CATALOG_ROOT_PUBLIC_KEY }}
          ATTOOL_CATALOG_SIGNING_KEY_ID: ${{ secrets.ATTOOL_CATALOG_SIGNING_KEY_ID }}
          ATTOOL_CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.ATTOOL_CATALOG_SIGNING_PRIVATE_KEY }}
          ATTOOL_PUBLISHER_KEY_ID: ${{ secrets[steps.application.outputs.publisher_key_secret] }}
          APP_ID: ${{ inputs.app_id }}
          RELEASE_JSON: ${{ steps.release.outputs.release_json }}
          ASSET_DIRECTORY: ${{ steps.release.outputs.asset_directory }}
        run: |
          GENERATED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EXPIRES_AT=$(date -u -d '+7 days' '+%Y-%m-%dT%H:%M:%SZ')
          CATALOG_ARGS=()
          if [ -f catalog/v1/catalog.json ]; then
            CATALOG_ARGS+=(
              --catalog catalog/v1/catalog.json
              --catalog-signature catalog/v1/catalog.json.sig
            )
          fi
          pnpm publish:catalog -- \
            --app "$APP_ID" \
            --root catalog/v1/root.json \
            --root-signature catalog/v1/root.json.sig \
            "${CATALOG_ARGS[@]}" \
            --release "$RELEASE_JSON" \
            --assets "$ASSET_DIRECTORY" \
            --output catalog/v1 \
            --generated-at "$GENERATED_AT" \
            --expires-at "$EXPIRES_AT"

      - name: Ensure Root was not modified
        run: |
          git diff --exit-code -- catalog/v1/root.json catalog/v1/root.json.sig
          git diff --check
          test -n "$(git status --short -- catalog/v1/catalog.json catalog/v1/catalog.json.sig)"

      - name: Create Catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ steps.application.outputs.name }}
          APP_SLUG: ${{ steps.application.outputs.slug }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="catalog/${APP_SLUG}-${RELEASE_VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Catalog branch already exists: $BRANCH" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/v1/catalog.json catalog/v1/catalog.json.sig
          git commit -m "chore: publish ${APP_NAME} ${RELEASE_VERSION} catalog"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "chore: publish ${APP_NAME} ${RELEASE_VERSION} catalog" \
            --body "Publishes verified ${APP_NAME} release ${RELEASE_TAG} through the signed production Catalog. Root metadata is unchanged."
