<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 设置布局原型</title>
  <!--
    设计假设：这是 AT Tool 桌面端设置弹窗，而非独立管理后台。
    核心任务：快速切换 provider、维护连接信息、管理并去重模型。
    布局策略：固定 provider 导航 + 连接/模型分页 + 模型主从编辑；低频导入导出进入抽屉。
    视觉策略：沿用项目 Mono Dark / Light、emerald accent、系统字体和 4/6/8/12px 圆角体系。
  -->
  <style>
    :root {
      --bg-base: #0a0a0b;
      --bg-elevated: #131316;
      --bg-elev-2: #18181c;
      --bg-overlay: #1d1d22;
      --line: #1f1f23;
      --line-strong: #28282d;
      --text: #ededed;
      --text-muted: #8b8b8b;
      --text-faint: #6a6a6f;
      --accent: #34d399;
      --accent-hover: #4ade80;
      --accent-pressed: #16a34a;
      --accent-fg: #0a0a0b;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --accent-line: rgba(52, 211, 153, 0.35);
      --error: #f87171;
      --error-soft: rgba(248, 113, 113, 0.14);
      --warning: #f5b94b;
      --warning-soft: rgba(245, 185, 75, 0.14);
      --info: #60a5fa;
      --info-soft: rgba(96, 165, 250, 0.14);
      --radius-sm: 4px;
      --radius: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;
      --font-sans: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --shadow-pop: 0 12px 36px rgba(0, 0, 0, 0.52);
      --motion-fast: 120ms ease;
      --motion-mid: 180ms ease;
    }

    [data-theme="light"] {
      --bg-base: #f2f3f2;
      --bg-elevated: #ffffff;
      --bg-elev-2: #f4f4f5;
      --bg-overlay: #ffffff;
      --line: #e4e4e7;
      --line-strong: #d4d4d8;
      --text: #18181b;
      --text-muted: #71717a;
      --text-faint: #a1a1aa;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-pressed: #047857;
      --accent-fg: #ffffff;
      --accent-soft: rgba(16, 185, 129, 0.10);
      --accent-line: rgba(16, 185, 129, 0.28);
      --error: #dc2626;
      --error-soft: rgba(220, 38, 38, 0.08);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.08);
      --info: #2563eb;
      --info-soft: rgba(37, 99, 235, 0.08);
      --shadow-pop: 0 14px 42px rgba(24, 24, 27, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: var(--text);
      background: var(--bg-base);
      font-family: var(--font-sans);
      font-size: 13px;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent-line);
      outline-offset: 1px;
    }

    .app-window {
      width: min(1120px, calc(100vw - 48px));
      height: min(760px, calc(100vh - 48px));
      min-height: 620px;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--bg-overlay);
      box-shadow: var(--shadow-pop);
    }

    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 14px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .window-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .window-title h1 { margin: 0; font-size: 17px; font-weight: 650; }
    .window-title span { color: var(--text-faint); font-size: 12px; }
    .header-actions, .toolbar-actions, .form-actions, .inline-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      transition: background var(--motion-fast), border-color var(--motion-fast), color var(--motion-fast);
    }

    .icon-button { width: 30px; padding: 0; }
    .button { padding: 0 11px; }
    .icon-button:hover, .button:hover { background: var(--bg-elev-2); border-color: var(--text-faint); }
    .icon-button.danger:hover { color: var(--error); border-color: var(--error); background: var(--error-soft); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .button.ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
    .button.ghost:hover { color: var(--text); background: var(--bg-elev-2); }
    .button:disabled { opacity: 0.45; cursor: not-allowed; }
    .icon-button svg, .button svg, .search-box svg, .provider-mark svg, .empty-state svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    .workspace { min-height: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .provider-rail {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border-right: 1px solid var(--line);
      background: var(--bg-elevated);
    }

    .rail-head { padding: 18px 14px 10px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }
    .rail-head .button { width: 100%; }
    .provider-list { min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
    .provider-item {
      width: 100%;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 9px;
      padding: 9px 8px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }
    .provider-item + .provider-item { margin-top: 3px; }
    .provider-item:hover { background: var(--bg-elev-2); }
    .provider-item.active { background: var(--accent-soft); border-color: var(--accent-line); }
    .provider-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--text-muted);
      background: var(--bg-overlay);
    }
    .provider-item.active .provider-mark { color: var(--accent); border-color: var(--accent-line); }
    .provider-copy { min-width: 0; display: grid; gap: 2px; }
    .provider-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .provider-meta { color: var(--text-muted); font-size: 11px; }
    .status-dot { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--text-faint); }
    .status-dot.online { background: var(--accent); }
    .status-dot.draft { background: var(--warning); }

    .rail-foot {
      display: grid;
      gap: 4px;
      padding: 10px 8px 12px;
      border-top: 1px solid var(--line);
    }
    .rail-foot .button { width: 100%; justify-content: flex-start; }

    .content { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    .provider-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
    }
    .provider-heading { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .provider-heading .provider-mark { width: 38px; height: 38px; }
    .provider-heading-text { min-width: 0; display: grid; gap: 3px; }
    .provider-heading-text h2 { margin: 0; font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
    .provider-heading-text p { margin: 0; color: var(--text-muted); font-size: 12px; }
    .connection-state { color: var(--accent); }

    .tabs { display: flex; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .tab {
      position: relative;
      height: 38px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); font-weight: 600; }
    .tab.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: var(--accent);
    }

    .tab-panel { min-height: 0; overflow: hidden; }
    .connection-panel { height: 100%; overflow-y: auto; padding: 20px; }
    .form-shell { max-width: 760px; display: grid; gap: 18px; }
    .form-section { display: grid; gap: 12px; }
    .section-title { margin: 0; font-size: 12px; font-weight: 650; color: var(--text); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { min-width: 0; display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--text-muted); font-size: 11px; font-weight: 550; }
    .input-wrap { position: relative; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--bg-elevated);
      color: var(--text);
      transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
    }
    input, select { height: 34px; padding: 0 10px; }
    textarea { min-height: 170px; padding: 10px; resize: vertical; font-family: var(--font-mono); line-height: 1.55; }
    input:hover, select:hover, textarea:hover { border-color: var(--text-faint); }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); outline: none; }
    input::placeholder, textarea::placeholder { color: var(--text-faint); }
    .input-wrap input { padding-right: 38px; }
    .input-action { position: absolute; top: 2px; right: 2px; border: 0; background: transparent; }
    .helper { color: var(--text-faint); font-size: 11px; }
    .form-divider { height: 1px; background: var(--line); }
    .form-actions { justify-content: flex-end; }

    .models-panel { height: 100%; min-height: 0; display: grid; grid-template-columns: minmax(310px, 44%) minmax(330px, 1fr); }
    .models-browser { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); border-right: 1px solid var(--line); }
    .models-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); }
    .search-box { position: relative; }
    .search-box svg { position: absolute; top: 9px; left: 9px; color: var(--text-faint); }
    .search-box input { padding-left: 31px; }
    .model-list { min-height: 0; overflow-y: auto; padding: 6px; }
    .model-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }
    .model-row + .model-row { margin-top: 2px; }
    .model-row:hover { background: var(--bg-elev-2); }
    .model-row.active { background: var(--accent-soft); border-color: var(--accent-line); }
    .model-main { min-width: 0; display: grid; gap: 4px; }
    .model-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .model-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
    .capabilities { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .capability {
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--bg-elev-2);
      color: var(--text-muted);
      font-size: 10px;
    }
    .model-row.active .capability { background: var(--bg-elevated); }

    .model-editor { min-width: 0; min-height: 0; overflow-y: auto; padding: 18px 20px; }
    .editor-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .editor-heading h3 { margin: 0 0 4px; font-size: 14px; }
    .editor-heading p { margin: 0; color: var(--text-muted); font-size: 11px; }
    .editor-form { display: grid; gap: 16px; }
    .check-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .check-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg-elevated);
      cursor: pointer;
    }
    .check-option:has(input:checked) { border-color: var(--accent-line); background: var(--accent-soft); }
    .check-option input { width: 14px; height: 14px; accent-color: var(--accent); }
    .validation {
      display: none;
      padding: 8px 10px;
      border: 1px solid var(--error);
      border-radius: var(--radius);
      background: var(--error-soft);
      color: var(--error);
      font-size: 11px;
    }
    .validation.show { display: block; }
    .editor-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 2px; }
    .empty-state { height: 100%; display: grid; place-items: center; padding: 30px; color: var(--text-muted); text-align: center; }
    .empty-state-inner { display: grid; justify-items: center; gap: 8px; }
    .empty-state svg { width: 28px; height: 28px; color: var(--text-faint); }
    .empty-state strong { color: var(--text); font-size: 13px; }
    .empty-state p { margin: 0; max-width: 260px; font-size: 11px; line-height: 1.5; }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      justify-content: flex-end;
      background: rgba(0, 0, 0, 0.34);
    }
    .drawer-backdrop.open { display: flex; }
    .drawer {
      width: min(460px, 92vw);
      height: 100%;
      display: grid;
      grid-template-rows: 56px auto minmax(0, 1fr) auto;
      background: var(--bg-overlay);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow-pop);
      animation: drawer-in var(--motion-mid);
    }
    @keyframes drawer-in { from { transform: translateX(18px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; font-size: 15px; }
    .drawer-tabs { padding-top: 8px; }
    .drawer-body { min-height: 0; overflow-y: auto; padding: 18px; }
    .drawer-copy { margin: 0 0 12px; color: var(--text-muted); font-size: 12px; line-height: 1.6; }
    .drawer-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }

    .toast-region { position: fixed; top: 18px; right: 18px; z-index: 40; display: grid; gap: 8px; }
    .toast {
      min-width: 240px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--bg-overlay);
      box-shadow: var(--shadow-pop);
      animation: toast-in var(--motion-mid);
    }
    .toast.success { border-color: var(--accent-line); }
    .toast.error { border-color: var(--error); color: var(--error); }
    @keyframes toast-in { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .reopen {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--bg-overlay);
      box-shadow: var(--shadow-pop);
    }
    .reopen.show { display: flex; }

    @media (max-width: 820px) {
      body { padding: 0; overflow: auto; }
      .app-window { width: 100vw; height: 100vh; min-height: 640px; border: 0; border-radius: 0; }
      .workspace { grid-template-columns: 200px minmax(0, 1fr); }
      .models-panel { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 42%) minmax(0, 1fr); }
      .models-browser { border-right: 0; border-bottom: 1px solid var(--line); }
      .field-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .provider-header { align-items: flex-start; }
      .provider-header > .toolbar-actions { flex-wrap: wrap; justify-content: flex-end; }
    }

    @media (max-width: 560px) {
      .workspace { grid-template-columns: 72px minmax(0, 1fr); }
      .rail-head { padding: 12px 8px 8px; }
      .rail-head .button span, .provider-copy, .rail-foot .button span { display: none; }
      .rail-head .button, .rail-foot .button { width: 100%; padding: 0; justify-content: center; }
      .provider-item { grid-template-columns: 1fr; justify-items: center; padding: 8px 4px; }
      .provider-item .status-dot { display: none; }
      .window-title span, #testConnectionText { display: none; }
      .provider-header { min-height: 70px; padding: 12px; }
      .provider-heading .provider-mark { display: none; }
      .tabs { padding: 0 12px; }
      .models-panel { grid-template-rows: minmax(205px, 40%) minmax(0, 1fr); }
      .model-editor { padding: 14px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main id="prototype" class="app-window" data-screen-label="AI 设置">
    <header class="window-header">
      <div class="window-title">
        <h1>AI 设置</h1>
        <span id="globalSummary"></span>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-button" type="button" title="切换主题" aria-label="切换主题"></button>
        <button id="closeWindow" class="icon-button" type="button" title="关闭" aria-label="关闭"></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="provider-rail">
        <div class="rail-head">
          <p class="eyebrow">Providers</p>
          <button id="addProvider" class="button" type="button" title="新增 provider" aria-label="新增 provider"></button>
        </div>
        <div id="providerList" class="provider-list"></div>
        <div class="rail-foot">
          <button id="openConfig" class="button ghost" type="button" title="导入或导出配置" aria-label="导入或导出配置"></button>
        </div>
      </aside>

      <section class="content">
        <header class="provider-header">
          <div class="provider-heading">
            <div class="provider-mark" id="selectedProviderIcon"></div>
            <div class="provider-heading-text">
              <h2 id="selectedProviderName"></h2>
              <p><span id="connectionState" class="connection-state"></span><span id="providerKind"></span></p>
            </div>
          </div>
          <div class="toolbar-actions">
            <button id="testConnection" class="button" type="button" title="测试连接" aria-label="测试连接"></button>
            <button id="deleteProvider" class="icon-button danger" type="button" title="删除 provider" aria-label="删除 provider"></button>
          </div>
        </header>

        <nav class="tabs" aria-label="Provider 设置">
          <button class="tab" type="button" data-tab="connection">连接配置</button>
          <button class="tab active" type="button" data-tab="models">模型</button>
        </nav>

        <div class="tab-panel">
          <section id="connectionPanel" class="connection-panel" hidden>
            <form id="providerForm" class="form-shell">
              <div class="form-section">
                <h3 class="section-title">基本信息</h3>
                <div class="field-grid">
                  <div class="field">
                    <label for="providerNameInput">名称</label>
                    <input id="providerNameInput" name="name" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label for="providerKindSelect">类型</label>
                    <select id="providerKindSelect" name="kind">
                      <option value="openai">OpenAI 兼容</option>
                      <option value="anthropic">Anthropic</option>
                      <option value="ollama">Ollama</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="form-divider"></div>
              <div class="form-section">
                <h3 class="section-title">连接</h3>
                <div class="field-grid">
                  <div class="field full">
                    <label for="baseUrlInput">Base URL</label>
                    <input id="baseUrlInput" name="baseUrl" placeholder="https://api.openai.com/v1" autocomplete="url" />
                  </div>
                  <div class="field full">
                    <label for="apiKeyInput">API Key</label>
                    <div class="input-wrap">
                      <input id="apiKeyInput" name="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
                      <button id="toggleKey" class="icon-button input-action" type="button" title="显示或隐藏 API Key" aria-label="显示或隐藏 API Key"></button>
                    </div>
                    <span class="helper">API Key 仅保存在本机。</span>
                  </div>
                </div>
              </div>
              <div class="form-actions">
                <button class="button primary" type="submit">保存更改</button>
              </div>
            </form>
          </section>

          <section id="modelsPanel" class="models-panel">
            <div class="models-browser">
              <div class="models-toolbar">
                <div class="search-box">
                  <span id="searchIcon"></span>
                  <input id="modelSearch" type="search" placeholder="搜索模型" autocomplete="off" />
                </div>
                <button id="addModel" class="icon-button" type="button" title="新增模型" aria-label="新增模型"></button>
              </div>
              <div id="modelList" class="model-list"></div>
            </div>
            <div id="modelEditor" class="model-editor"></div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <section id="reopen" class="reopen">
    <span>AI 设置已关闭</span>
    <button id="reopenWindow" class="button primary" type="button">重新打开</button>
  </section>

  <div id="configDrawer" class="drawer-backdrop" aria-hidden="true">
    <aside class="drawer" aria-label="导入导出配置">
      <header class="drawer-head">
        <h2>配置迁移</h2>
        <button id="closeConfig" class="icon-button" type="button" title="关闭" aria-label="关闭"></button>
      </header>
      <nav class="tabs drawer-tabs" aria-label="配置迁移">
        <button class="tab active" type="button" data-config-tab="export">导出</button>
        <button class="tab" type="button" data-config-tab="import">导入</button>
      </nav>
      <div class="drawer-body">
        <div id="exportPane">
          <p class="drawer-copy">导出所有 provider 与模型配置。默认不包含 API Key。</p>
          <textarea id="exportText" readonly></textarea>
        </div>
        <div id="importPane" hidden>
          <p class="drawer-copy">粘贴此前导出的 JSON，导入前会检查重复模型。</p>
          <textarea id="importText" placeholder="粘贴配置 JSON"></textarea>
        </div>
      </div>
      <footer class="drawer-foot">
        <button id="secondaryConfigAction" class="button" type="button">包含 API Key</button>
        <button id="primaryConfigAction" class="button primary" type="button">复制 JSON</button>
      </footer>
    </aside>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <script>
    const icons = {
      close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>',
      moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8 8 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"></path></svg>',
      sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>',
      plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>',
      database: '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"></ellipse><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path></svg>',
      transfer: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3M18 7l-3 3M6 17l3-3"></path></svg>',
      search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>',
      trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path></svg>',
      eye: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>',
      activity: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h3l2-6 4 11 2-5h5"></path></svg>'
    };

    const kindLabels = { openai: 'OpenAI 兼容', anthropic: 'Anthropic', ollama: 'Ollama' };
    const capabilityLabels = { text: '文本', image: '图片', audio: '音频', video: '视频' };
    const state = {
      activeTab: 'models',
      configTab: 'export',
      selectedProviderId: 'p1',
      selectedModelId: 'm1',
      providers: [
        {
          id: 'p1', name: 'Attson', kind: 'openai', baseUrl: 'https://api.openai.com/v1', apiKey: 'sk-attool-local-key', online: true, draft: false,
          models: [
            { id: 'm1', modelId: 'gpt-5.5', displayName: 'GPT-5.5', capabilities: ['text', 'image', 'audio', 'video'], temperature: '', maxTokens: '' },
            { id: 'm2', modelId: 'gpt-4.1', displayName: 'GPT-4.1', capabilities: ['text', 'image'], temperature: '0.7', maxTokens: '8192' },
            { id: 'm3', modelId: 'o4-mini', displayName: 'o4 mini', capabilities: ['text', 'image'], temperature: '', maxTokens: '' }
          ]
        },
        {
          id: 'p2', name: 'Claude Lab', kind: 'anthropic', baseUrl: 'https://api.anthropic.com', apiKey: 'sk-ant-local-key', online: true, draft: false,
          models: [
            { id: 'm4', modelId: 'claude-opus-4-1', displayName: 'Claude Opus 4.1', capabilities: ['text', 'image'], temperature: '0.5', maxTokens: '16384' },
            { id: 'm5', modelId: 'claude-sonnet-4', displayName: 'Claude Sonnet 4', capabilities: ['text', 'image'], temperature: '', maxTokens: '' }
          ]
        }
      ]
    };

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));
    const currentProvider = () => state.providers.find((provider) => provider.id === state.selectedProviderId);
    const currentModel = () => currentProvider()?.models.find((model) => model.id === state.selectedModelId);

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function uid(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function toast(message, tone = 'success') {
      const node = document.createElement('div');
      node.className = `toast ${tone}`;
      node.textContent = message;
      $('#toastRegion').appendChild(node);
      window.setTimeout(() => node.remove(), 2400);
    }

    function providerIcon() {
      return icons.database;
    }

    function renderSummary() {
      const modelCount = state.providers.reduce((total, provider) => total + provider.models.length, 0);
      $('#globalSummary').textContent = `${state.providers.length} providers · ${modelCount} models`;
    }

    function renderProviders() {
      $('#providerList').innerHTML = state.providers.map((provider) => `
        <button class="provider-item ${provider.id === state.selectedProviderId ? 'active' : ''}" type="button" data-provider-id="${provider.id}">
          <span class="provider-mark">${providerIcon()}</span>
          <span class="provider-copy">
            <span class="provider-name">${escapeHtml(provider.name || '新 Provider')}</span>
            <span class="provider-meta">${escapeHtml(kindLabels[provider.kind])} · ${provider.models.length} 个模型</span>
          </span>
          <span class="status-dot ${provider.draft ? 'draft' : provider.online ? 'online' : ''}" title="${provider.draft ? '未保存' : provider.online ? '连接正常' : '未测试'}"></span>
        </button>
      `).join('');

      $$('.provider-item').forEach((button) => {
        button.addEventListener('click', () => {
          state.selectedProviderId = button.dataset.providerId;
          const provider = currentProvider();
          state.selectedModelId = provider.models[0]?.id || null;
          renderAll();
        });
      });
    }

    function renderProviderHeader() {
      const provider = currentProvider();
      $('#selectedProviderIcon').innerHTML = providerIcon();
      $('#selectedProviderName').textContent = provider.name || '新 Provider';
      $('#connectionState').textContent = provider.draft ? '未保存 · ' : provider.online ? '连接正常 · ' : '尚未测试 · ';
      $('#providerKind').textContent = kindLabels[provider.kind];
      $('#providerNameInput').value = provider.name;
      $('#providerKindSelect').value = provider.kind;
      $('#baseUrlInput').value = provider.baseUrl;
      $('#apiKeyInput').value = provider.apiKey;
      $('#testConnection').disabled = provider.draft;
      $('#testConnection').innerHTML = `${icons.activity}<span id="testConnectionText">测试连接</span>`;
    }

    function renderTabs() {
      $$('.tab[data-tab]').forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === state.activeTab));
      $('#connectionPanel').hidden = state.activeTab !== 'connection';
      $('#modelsPanel').hidden = state.activeTab !== 'models';
    }

    function renderModels() {
      const provider = currentProvider();
      const query = $('#modelSearch').value.trim().toLocaleLowerCase();
      const models = provider.models.filter((model) =>
        model.modelId.toLocaleLowerCase().includes(query) || model.displayName.toLocaleLowerCase().includes(query)
      );

      if (models.length === 0) {
        $('#modelList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-inner">${icons.search}<strong>没有匹配模型</strong><p>调整搜索词，或新增一个模型。</p></div>
          </div>`;
      } else {
        $('#modelList').innerHTML = models.map((model) => `
          <button class="model-row ${model.id === state.selectedModelId ? 'active' : ''}" type="button" data-model-id="${model.id}">
            <span class="model-main">
              <span class="model-title">${escapeHtml(model.displayName || model.modelId || '未命名模型')}</span>
              <span class="model-id">${escapeHtml(model.modelId || '等待填写 model id')}</span>
            </span>
            <span class="capabilities">${model.capabilities.slice(0, 2).map((capability) => `<span class="capability">${capabilityLabels[capability]}</span>`).join('')}</span>
          </button>
        `).join('');
      }

      $$('.model-row').forEach((button) => {
        button.addEventListener('click', () => {
          state.selectedModelId = button.dataset.modelId;
          renderModels();
          renderModelEditor();
        });
      });
      renderModelEditor();
    }

    function renderModelEditor() {
      const model = currentModel();
      if (!model) {
        $('#modelEditor').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-inner">${icons.database}<strong>选择一个模型</strong><p>从左侧列表选择模型，或新建模型后填写参数。</p></div>
          </div>`;
        return;
      }

      $('#modelEditor').innerHTML = `
        <div class="editor-heading">
          <div><h3>${model.isNew ? '新增模型' : '模型详情'}</h3><p>Provider 内 model ID 必须唯一</p></div>
        </div>
        <form id="modelForm" class="editor-form">
          <div class="field-grid">
            <div class="field full">
              <label for="modelIdInput">Model ID</label>
              <input id="modelIdInput" name="modelId" value="${escapeHtml(model.modelId)}" placeholder="例如 gpt-5.5" autocomplete="off" />
            </div>
            <div class="field full">
              <label for="modelDisplayNameInput">显示名称</label>
              <input id="modelDisplayNameInput" name="displayName" value="${escapeHtml(model.displayName)}" placeholder="留空时使用 Model ID" autocomplete="off" />
            </div>
          </div>
          <div class="field">
            <label>能力</label>
            <div class="check-grid">
              ${Object.entries(capabilityLabels).map(([value, label]) => `
                <label class="check-option"><input type="checkbox" name="capability" value="${value}" ${model.capabilities.includes(value) ? 'checked' : ''} /><span>${label}</span></label>
              `).join('')}
            </div>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="temperatureInput">Temperature</label>
              <input id="temperatureInput" name="temperature" type="number" min="0" max="2" step="0.1" value="${escapeHtml(model.temperature)}" placeholder="默认" />
            </div>
            <div class="field">
              <label for="maxTokensInput">Max tokens</label>
              <input id="maxTokensInput" name="maxTokens" type="number" min="1" step="1" value="${escapeHtml(model.maxTokens)}" placeholder="默认" />
            </div>
          </div>
          <div id="modelValidation" class="validation"></div>
          <div class="editor-actions">
            <button id="removeModel" class="button ghost" type="button">${model.isNew ? '取消' : '删除模型'}</button>
            <button class="button primary" type="submit">保存模型</button>
          </div>
        </form>
      `;

      $('#modelForm').addEventListener('submit', saveModel);
      $('#removeModel').addEventListener('click', removeModel);
    }

    function saveModel(event) {
      event.preventDefault();
      const provider = currentProvider();
      const model = currentModel();
      const form = new FormData(event.currentTarget);
      const modelId = String(form.get('modelId') || '').trim();
      const validation = $('#modelValidation');
      if (!modelId) {
        validation.textContent = '请输入 Model ID。';
        validation.classList.add('show');
        return;
      }
      const duplicate = provider.models.some((candidate) => candidate.id !== model.id && candidate.modelId.trim() === modelId);
      if (duplicate) {
        validation.textContent = `该 provider 下已存在模型“${modelId}”。`;
        validation.classList.add('show');
        return;
      }
      model.modelId = modelId;
      model.displayName = String(form.get('displayName') || '').trim() || modelId;
      model.capabilities = form.getAll('capability');
      if (model.capabilities.length === 0) model.capabilities = ['text'];
      model.temperature = String(form.get('temperature') || '');
      model.maxTokens = String(form.get('maxTokens') || '');
      model.isNew = false;
      toast('模型已保存');
      renderAll();
    }

    function removeModel() {
      const provider = currentProvider();
      const model = currentModel();
      if (!model.isNew && !window.confirm(`删除模型“${model.displayName}”？`)) return;
      provider.models = provider.models.filter((candidate) => candidate.id !== model.id);
      state.selectedModelId = provider.models[0]?.id || null;
      toast(model.isNew ? '已取消新增' : '模型已删除');
      renderAll();
    }

    function addModel() {
      const provider = currentProvider();
      const model = { id: uid('model'), modelId: '', displayName: '', capabilities: ['text'], temperature: '', maxTokens: '', isNew: true };
      provider.models.unshift(model);
      state.selectedModelId = model.id;
      $('#modelSearch').value = '';
      renderAll();
      window.setTimeout(() => $('#modelIdInput')?.focus(), 0);
    }

    function addProvider() {
      const provider = {
        id: uid('provider'), name: '', kind: 'openai', baseUrl: 'https://api.openai.com/v1', apiKey: '', online: false, draft: true, models: []
      };
      state.providers.push(provider);
      state.selectedProviderId = provider.id;
      state.selectedModelId = null;
      state.activeTab = 'connection';
      renderAll();
      window.setTimeout(() => $('#providerNameInput').focus(), 0);
    }

    function saveProvider(event) {
      event.preventDefault();
      const provider = currentProvider();
      const form = new FormData(event.currentTarget);
      const name = String(form.get('name') || '').trim();
      if (!name) {
        toast('请输入 provider 名称', 'error');
        $('#providerNameInput').focus();
        return;
      }
      provider.name = name;
      provider.kind = String(form.get('kind'));
      provider.baseUrl = String(form.get('baseUrl') || '').trim();
      provider.apiKey = String(form.get('apiKey') || '');
      provider.draft = false;
      provider.online = false;
      toast('Provider 已保存');
      renderAll();
    }

    function deleteProvider() {
      const provider = currentProvider();
      if (!provider.draft && !window.confirm(`删除 provider“${provider.name}”及其全部模型？`)) return;
      if (state.providers.length === 1) {
        toast('至少保留一个 provider', 'error');
        return;
      }
      state.providers = state.providers.filter((candidate) => candidate.id !== provider.id);
      state.selectedProviderId = state.providers[0].id;
      state.selectedModelId = state.providers[0].models[0]?.id || null;
      toast('Provider 已删除');
      renderAll();
    }

    function testConnection() {
      const provider = currentProvider();
      const button = $('#testConnection');
      button.disabled = true;
      button.innerHTML = `${icons.activity}<span id="testConnectionText">正在测试</span>`;
      window.setTimeout(() => {
        provider.online = true;
        toast('连接成功');
        renderAll();
      }, 800);
    }

    function exportPayload(includeKeys) {
      return JSON.stringify({
        version: 1,
        providers: state.providers.map((provider) => ({
          ...provider,
          apiKey: includeKeys ? provider.apiKey : '',
          models: provider.models.map(({ isNew, ...model }) => model)
        }))
      }, null, 2);
    }

    function renderConfigDrawer(includeKeys = false) {
      $$('.tab[data-config-tab]').forEach((tab) => tab.classList.toggle('active', tab.dataset.configTab === state.configTab));
      $('#exportPane').hidden = state.configTab !== 'export';
      $('#importPane').hidden = state.configTab !== 'import';
      if (state.configTab === 'export') {
        $('#exportText').value = exportPayload(includeKeys);
        $('#secondaryConfigAction').hidden = false;
        $('#secondaryConfigAction').textContent = includeKeys ? '移除 API Key' : '包含 API Key';
        $('#secondaryConfigAction').dataset.includeKeys = includeKeys ? 'true' : 'false';
        $('#primaryConfigAction').textContent = '复制 JSON';
      } else {
        $('#secondaryConfigAction').hidden = true;
        $('#primaryConfigAction').textContent = '导入配置';
      }
    }

    function openConfig() {
      state.configTab = 'export';
      renderConfigDrawer(false);
      $('#configDrawer').classList.add('open');
      $('#configDrawer').setAttribute('aria-hidden', 'false');
    }

    function closeConfig() {
      $('#configDrawer').classList.remove('open');
      $('#configDrawer').setAttribute('aria-hidden', 'true');
    }

    function primaryConfigAction() {
      if (state.configTab === 'export') {
        const text = $('#exportText').value;
        navigator.clipboard?.writeText(text).then(() => toast('JSON 已复制')).catch(() => {
          $('#exportText').select();
          toast('已选中 JSON，请手动复制');
        });
        return;
      }
      const input = $('#importText').value.trim();
      if (!input) {
        toast('请先粘贴配置 JSON', 'error');
        return;
      }
      try {
        const parsed = JSON.parse(input);
        if (!Array.isArray(parsed.providers) || parsed.providers.length === 0) throw new Error('invalid');
        const providers = parsed.providers.map((provider, providerIndex) => {
          const models = Array.isArray(provider.models) ? provider.models : [];
          const normalizedIds = models.map((model) => String(model.modelId || '').trim());
          if (normalizedIds.some((modelId) => !modelId) || new Set(normalizedIds).size !== normalizedIds.length) {
            throw new Error('duplicate-model');
          }
          return {
            id: String(provider.id || uid(`provider-${providerIndex}`)),
            name: String(provider.name || `Provider ${providerIndex + 1}`),
            kind: kindLabels[provider.kind] ? provider.kind : 'openai',
            baseUrl: String(provider.baseUrl || ''),
            apiKey: String(provider.apiKey || ''),
            online: false,
            draft: false,
            models: models.map((model, modelIndex) => ({
              id: String(model.id || uid(`model-${modelIndex}`)),
              modelId: normalizedIds[modelIndex],
              displayName: String(model.displayName || normalizedIds[modelIndex]),
              capabilities: Array.isArray(model.capabilities) && model.capabilities.length ? model.capabilities : ['text'],
              temperature: model.temperature ?? '',
              maxTokens: model.maxTokens ?? ''
            }))
          };
        });
        state.providers = providers;
        state.selectedProviderId = providers[0].id;
        state.selectedModelId = providers[0].models[0]?.id || null;
        $('#importText').value = '';
        closeConfig();
        renderAll();
        toast(`已导入 ${providers.length} 个 provider`);
      } catch {
        toast('配置无效，或包含重复模型 ID', 'error');
      }
    }

    function renderAll() {
      renderSummary();
      renderProviders();
      renderProviderHeader();
      renderTabs();
      renderModels();
    }

    $('#themeToggle').innerHTML = icons.moon;
    $('#closeWindow').innerHTML = icons.close;
    $('#deleteProvider').innerHTML = icons.trash;
    $('#toggleKey').innerHTML = icons.eye;
    $('#searchIcon').innerHTML = icons.search;
    $('#addModel').innerHTML = icons.plus;
    $('#closeConfig').innerHTML = icons.close;
    $('#addProvider').innerHTML = `${icons.plus}<span>新增 provider</span>`;
    $('#openConfig').innerHTML = `${icons.transfer}<span>导入 / 导出配置</span>`;
    $('#testConnection').innerHTML = `${icons.activity}<span id="testConnectionText">测试连接</span>`;

    $$('.tab[data-tab]').forEach((tab) => tab.addEventListener('click', () => {
      state.activeTab = tab.dataset.tab;
      renderTabs();
    }));
    $$('.tab[data-config-tab]').forEach((tab) => tab.addEventListener('click', () => {
      state.configTab = tab.dataset.configTab;
      renderConfigDrawer(false);
    }));
    $('#modelSearch').addEventListener('input', renderModels);
    $('#addModel').addEventListener('click', addModel);
    $('#addProvider').addEventListener('click', addProvider);
    $('#providerForm').addEventListener('submit', saveProvider);
    $('#deleteProvider').addEventListener('click', deleteProvider);
    $('#testConnection').addEventListener('click', testConnection);
    $('#toggleKey').addEventListener('click', () => {
      const input = $('#apiKeyInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
    $('#themeToggle').addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'light' : 'dark';
      $('#themeToggle').innerHTML = dark ? icons.moon : icons.sun;
    });
    $('#closeWindow').addEventListener('click', () => {
      $('#prototype').style.display = 'none';
      $('#reopen').classList.add('show');
    });
    $('#reopenWindow').addEventListener('click', () => {
      $('#prototype').style.display = 'grid';
      $('#reopen').classList.remove('show');
    });
    $('#openConfig').addEventListener('click', openConfig);
    $('#closeConfig').addEventListener('click', closeConfig);
    $('#configDrawer').addEventListener('click', (event) => {
      if (event.target === $('#configDrawer')) closeConfig();
    });
    $('#secondaryConfigAction').addEventListener('click', () => {
      const includes = $('#secondaryConfigAction').dataset.includeKeys === 'true';
      renderConfigDrawer(!includes);
    });
    $('#primaryConfigAction').addEventListener('click', primaryConfigAction);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && $('#configDrawer').classList.contains('open')) closeConfig();
    });

    renderAll();
  </script>
</body>
</html>
